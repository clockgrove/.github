name: Bug report
description: Report a defect in this repository
type: Bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the defect without including credentials or private source.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include minimal steps and the relevant version or environment.
    validations:
      required: true
