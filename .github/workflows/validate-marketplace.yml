name: Validate Clockgrove Marketplace

on:
  pull_request:
    paths:
      - '.github/plugin/marketplace.json'
      - 'scripts/validate-marketplace.py'
      - '.github/workflows/validate-marketplace.yml'
  push:
    branches: [main]
    paths:
      - '.github/plugin/marketplace.json'
      - 'scripts/validate-marketplace.py'
      - '.github/workflows/validate-marketplace.yml'

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable marketplace pins
        run: python3 scripts/validate-marketplace.py
