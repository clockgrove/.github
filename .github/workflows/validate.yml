name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Issue templates parse and carry a name, a description and a body
        run: |
          for f in .github/ISSUE_TEMPLATE/*.yml; do
            yq -e '.name and .description and (.body | length > 0)' "$f" >/dev/null || { echo "::error file=$f::not a valid issue form"; exit 1; }
          done
